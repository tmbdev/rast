[workspace]
name = "rast"
version = "0.1.0"
description = "RAST family of branch-and-bound feature matching algorithms"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
cxx-compiler = "*"
make = "*"
swig = "3.0.*"
python = ">=3.9"
numpy = "*"

# Make the SWIG-built rast module importable from `pixi run python ...`.
[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/_build"

[tasks.build]
description = "Build librast.a, rast, rast-test, cedges, and _rast.so."
cmd = "./build.sh"

[tasks.build-cpp]
description = "Build the C++ targets only (skip the Python binding)."
cmd = "./build.sh librast.a rast rast-test cedges"

[tasks.clean]
cmd = "rm -rf _build"
